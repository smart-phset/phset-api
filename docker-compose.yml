services:

  postgres:
    image: postgres:18
    container_name: smartphset-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartphset}
      POSTGRES_USER: ${POSTGRES_USER:-smartphset}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartphset_dev_password}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartphset} -d ${POSTGRES_DB:-smartphset}"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

    networks:
      - smartphset-network


  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smartphset-mosquitto

    ports:
      - "1883:1883"
      - "9001:9001"

    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

    restart: unless-stopped

    networks:
      - smartphset-network


volumes:
  postgres-data:
  mosquitto-data:
  mosquitto-log:


networks:
  smartphset-network:
    driver: bridge