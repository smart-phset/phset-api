plugins {
	id 'java'
	id 'jacoco'

	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.smart.phset'
version = '0.0.1-SNAPSHOT'
description = 'SmartPhset IoT and AI Backend'


// ============================================================================
// JAVA
// ============================================================================

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}


// ============================================================================
// REPOSITORIES
// ============================================================================

repositories {
	mavenCentral()
}


// ============================================================================
// DEPENDENCIES
// ============================================================================

dependencies {

	// ========================================================================
	// REST API / SPRING MVC
	// ========================================================================

	// REST controllers, JSON APIs, HTTP clients and Spring MVC.
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// Jakarta Bean Validation:
	// @Valid, @NotBlank, @Email, @Size, @Min, @Max, etc.
	implementation 'org.springframework.boot:spring-boot-starter-validation'


	// ========================================================================
	// SPRING SECURITY
	// ========================================================================

	// Authentication, authorization, SecurityFilterChain,
	// PasswordEncoder, @PreAuthorize, etc.
	implementation 'org.springframework.boot:spring-boot-starter-security'


	// ========================================================================
	// JWT
	// ========================================================================

	// JWT API used by application code.
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'

	// JWT implementation required at runtime.
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'

	// Jackson integration for JWT claims.
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'


	// ========================================================================
	// DATABASE / SPRING DATA JPA
	// ========================================================================

	// JPA, Hibernate, repositories and transaction support.
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// PostgreSQL JDBC driver.
	// Version is managed by Spring Boot.
	runtimeOnly 'org.postgresql:postgresql'


	// ========================================================================
	// FLYWAY DATABASE MIGRATION
	// ========================================================================

	// Spring Boot Flyway integration.
	implementation 'org.springframework.boot:spring-boot-starter-flyway'

	// PostgreSQL-specific Flyway support.
	implementation 'org.flywaydb:flyway-database-postgresql'


	// ========================================================================
	// MQTT / ESP32 COMMUNICATION
	// ========================================================================

	// Core Spring Integration infrastructure.
	implementation 'org.springframework.boot:spring-boot-starter-integration'

	// MQTT inbound/outbound adapters.
	implementation 'org.springframework.integration:spring-integration-mqtt'

	// Paho MQTT v3 client.
	implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'


	// ========================================================================
	// REAL-TIME FRONTEND COMMUNICATION
	// ========================================================================

	// WebSocket support.
	// We may use SSE for most server -> browser events,
	// but keeping WebSocket support available is useful.
	implementation 'org.springframework.boot:spring-boot-starter-websocket'


	// ========================================================================
	// MONITORING / HEALTH
	// ========================================================================

	// /actuator/health, metrics and application health indicators.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'


	// ========================================================================
	// OPENAPI / SWAGGER UI
	// ========================================================================

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'


	// ========================================================================
	// LOMBOK
	// ========================================================================

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'


	// ========================================================================
	// MAPSTRUCT
	// ========================================================================

	// Compile-time Entity <-> DTO mapping.
	implementation 'org.mapstruct:mapstruct:1.6.3'

	// Generates mapper implementations.
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

	// Required for Lombok + MapStruct interoperability.
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'


	// ========================================================================
	// SPRING CONFIGURATION PROCESSOR
	// ========================================================================

	// Generates metadata for @ConfigurationProperties.
	//
	// Useful later for:
	// JwtProperties
	// AiProperties
	// MqttProperties
	// CorsProperties
	// StorageProperties
	// CameraProperties
	// SecurityProperties
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'


	// ========================================================================
	// GENERAL TESTING
	// ========================================================================

	// JUnit Jupiter, AssertJ, Mockito, Spring Boot Test, etc.
	testImplementation 'org.springframework.boot:spring-boot-starter-test'


	// ========================================================================
	// SPRING SECURITY TESTING
	// ========================================================================

	// @WithMockUser and Spring Security test utilities.
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'


	// ========================================================================
	// SPRING MVC TESTING
	// ========================================================================

	// MVC / MockMvc focused testing.
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'


	// ========================================================================
	// SPRING INTEGRATION / MQTT TESTING
	// ========================================================================

	testImplementation 'org.springframework.integration:spring-integration-test'


	// ========================================================================
	// TESTCONTAINERS
	// ========================================================================

	// Spring Boot Testcontainers integration.
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'

	// JUnit Jupiter support for Testcontainers.
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'

	// PostgreSQL Testcontainer.
	testImplementation 'org.testcontainers:testcontainers-postgresql'


	// ========================================================================
	// JUNIT PLATFORM
	// ========================================================================

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


// ============================================================================
// JAVA COMPILER
// ============================================================================

// Apply general Java compiler configuration to both
// production and test compilation.
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}


// ============================================================================
// MAPSTRUCT COMPILER CONFIGURATION
// ============================================================================

// Apply MapStruct processor options ONLY to main application compilation.
//
// This prevents compileTestJava from receiving MapStruct-specific options
// when no MapStruct processor is running in the test source set.
tasks.named('compileJava') {

	options.compilerArgs += [

			// Generated MapStruct implementations become Spring beans.
			'-Amapstruct.defaultComponentModel=spring',

			// Use constructor injection when generated mappers
			// depend on other mappers.
			'-Amapstruct.defaultInjectionStrategy=constructor',

			// Fail compilation if a target property is not mapped.
			//
			// This helps prevent DTO/API contract mistakes.
			'-Amapstruct.unmappedTargetPolicy=ERROR'
	]
}


// ============================================================================
// TESTING
// ============================================================================

tasks.named('test') {

	useJUnitPlatform()

	// Generate JaCoCo report after tests finish.
	finalizedBy tasks.named('jacocoTestReport')
}


// ============================================================================
// JACOCO CODE COVERAGE
// ============================================================================

tasks.named('jacocoTestReport') {

	dependsOn tasks.named('test')

	reports {

		// Useful for CI and code-quality tools.
		xml.required = true

		// Human-readable coverage report:
		// build/reports/jacoco/test/html/index.html
		html.required = true

		csv.required = false
	}
}


// ============================================================================
// TEST LOGGING
// ============================================================================

tasks.withType(Test).configureEach {

	testLogging {

		events 'passed', 'skipped', 'failed'

		exceptionFormat = 'full'

		showExceptions = true
		showCauses = true
		showStackTraces = true
	}
}