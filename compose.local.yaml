# Isolated development PostgreSQL only. Does not touch the EC2 stack or Mosquitto.
name: smartphset-api-local
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartphset}
      POSTGRES_USER: ${POSTGRES_USER:-smartphset}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private development DB password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - local-postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  local-postgres:
