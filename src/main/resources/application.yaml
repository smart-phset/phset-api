spring:

  application:
    name: smartphset-api


  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartphset}
    username: ${DB_USERNAME:smartphset}
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000


  jpa:

    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

        format_sql: true


  flyway:
    enabled: true
    locations: classpath:db/migration


server:
  port: ${PORT:9090}
  address: 0.0.0.0


management:

  endpoints:
    web:
      exposure:
        include:
          - health

  endpoint:
    health:
      show-details: never
      show-components: never


app:

  mqtt:
    enabled: ${MQTT_ENABLED:true}
    client-id: ${MQTT_CLIENT_ID:smartphset-api}
    devices: ${MQTT_DEVICES:grow-room-1}
    api-key: ${IOT_API_KEY:}
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}

  ai:
    ingest-key: ${AI_INGEST_KEY:}
    base-url: ${AI_BASE_URL:http://localhost:8000}
    api-key: ${AI_API_KEY:}

  security:
    jwt-secret: ${JWT_SECRET:}
