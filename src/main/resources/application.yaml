spring:

  application:
    name: smartphset-api


  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartphset}
    username: ${DB_USERNAME:smartphset}
    password: ${DB_PASSWORD:smartphset_dev_password}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000


  jpa:

    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

        format_sql: true


  flyway:
    enabled: true
    locations: classpath:db/migration


server:
  port: ${SERVER_PORT:9090}


management:

  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: when-authorized


app:

  mqtt:
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}

  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    api-key: ${AI_API_KEY:}

  security:
    jwt-secret: ${JWT_SECRET:}