# Activated by the Docker image; bootRun retains local defaults.
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:2}
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 60000
      max-lifetime: 600000
  jpa:
    properties:
      hibernate:
        format_sql: false

server:
  tomcat:
    threads:
      max: 20
      min-spare: 2
    max-connections: 100
    accept-count: 20
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
